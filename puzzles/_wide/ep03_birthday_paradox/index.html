    if (up >= 23) { circ(CHX + CHW * 23 / 70, CHB - CHH * (1 - pb(23)), 12, OR); txt("below 50% at person 23", 540, 760, 30, OR); }
    return "ALL DIFFERENT AMONG " + Math.max(1, Math.round(up)) + (Math.round(up) <= 1 ? " PERSON: " : " PEOPLE: ") + ((1 - pb(Math.max(1, Math.round(up)))) * 100).toFixed(1) + "%";
  }
  if (b === 5) {
    if (u < 0.5) { people(540, 640, 300, 23, 0.8, true); return "YOU VS THE ROOM  ·  22 PAIRS"; }
    people(540, 640, 300, 23, 0.4, false); return "EVERYONE VS EVERYONE  ·  253 PAIRS";
  }
  people(540, 640, 300, 23, 0.4 * (1 - clamp(u / 0.6)), false);
  txt("COUNT THE PAIRS", 540, 640, 56, INK);
  return "THE ODDS HIDE IN THE CHANCES";
}


function renderAt(t) {
  x.fillStyle = "#f4ecd8"; x.fillRect(0, 0, 1920, 1080);
  x.strokeStyle = "rgba(60,90,140,0.16)"; x.lineWidth = 2;
  for (let g = 0; g <= 1920; g += 40) { x.beginPath(); x.moveTo(g, 0); x.lineTo(g, 1080); x.stroke(); }
  for (let g = 0; g <= 1080; g += 40) { x.beginPath(); x.moveTo(0, g); x.lineTo(1920, g); x.stroke(); }
  const b = blockOf(t), u = clamp((t - B[b]) / (B[b + 1] - B[b]));
  if (t < LEAD) {
    stat.textContent = ""; x.textAlign = "center"; x.textBaseline = "middle";
    x.fillStyle = RED; x.font = "bold 44px " + FONT; x.fillText(CHAPTER.split("|")[0], 960, 430);
    x.fillStyle = INK; x.font = "bold 84px " + FONT; x.fillText(CHAPTER.split("|")[1], 960, 540);
    groups.forEach(g => { g.el.style.opacity = 0; });
    return;
  }
  x.save(); x.translate(463, -126); x.scale(0.92, 0.92);
  stat.textContent = scene(t, b, u) || "";
  x.restore();
  groups.forEach(g => {
    const on = t >= g.start && t < g.end;
    g.el.style.opacity = on ? 1 : 0;
    if (on) g.forEach(w => w.el.classList.toggle("on", t >= w.s));
  });
}
window.addEventListener("hf-seek", e => renderAt(e.detail.time));
renderAt(0);
const tl = gsap.timeline({ paused: true });
tl.fromTo("#title", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0);
window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
</script>
