<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f4ecd8; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #f4ecd8;
    font-family: "JetBrains Mono", monospace; color: #1c1c1c; }
  #cv { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .t { position: absolute; left: 0; width: 1920px; text-align: center; font-weight: 700; }
  #title { top: 26px; font-size: 52px; white-space: nowrap; }
  #stat { top: 92px; font-size: 28px; opacity: .7; letter-spacing: 2px; }
  #cap { top: 958px; left: 260px; width: 1400px; font-size: 52px; line-height: 62px; height: 124px; }
  .g { position: absolute; left: 0; top: 0; width: 1400px; text-align: center; opacity: 0; }
  .w { opacity: .22; }
  .w.on { opacity: 1; }
  .w.k.on { color: #d62828; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6.684" data-width="1920" data-height="1080">
  <canvas id="cv" class="clip" data-start="0" data-duration="6.684" width="1920" height="1080"></canvas>
  <div id="title" class="clip t" data-start="0" data-duration="6.684">Which one <span style="color:#d62828">fooled</span> you?</div>
  <div id="stat" class="clip t" data-start="0" data-duration="6.684"></div>
  <div id="cap" class="clip t" data-start="0" data-duration="6.684"></div>
  <audio id="voice" src="assets/voice.mp3" data-start="0.0" data-duration="6.684" data-volume="1"></audio>
</div>
<script>
const LEAD = 0.0, CHAPTER = "", WORDS = [{"w": "That's", "s": 0.0, "e": 0.279}, {"w": "six", "s": 0.348, "e": 0.569}, {"w": "puzzles.", "s": 0.639, "e": 1.196}, {"w": "Which", "s": 1.265, "e": 1.474}, {"w": "one", "s": 1.544, "e": 1.707}, {"w": "fooled", "s": 1.776, "e": 2.101}, {"w": "you", "s": 2.125, "e": 2.194}, {"w": "the", "s": 2.241, "e": 2.31}, {"w": "most?", "s": 2.357, "e": 2.752}, {"w": "Tell", "s": 3.158, "e": 3.367}, {"w": "us", "s": 3.425, "e": 3.495}, {"w": "in", "s": 3.541, "e": 3.599}, {"w": "the", "s": 3.622, "e": 3.692}, {"w": "comments,", "s": 3.738, "e": 4.168}, {"w": "and", "s": 4.191, "e": 4.272}, {"w": "subscribe", "s": 4.319, "e": 4.807}, {"w": "if", "s": 4.841, "e": 4.899}, {"w": "you", "s": 4.934, "e": 5.004}, {"w": "want", "s": 5.05, "e": 5.19}, {"w": "the", "s": 5.224, "e": 5.294}, {"w": "next", "s": 5.329, "e": 5.503}, {"w": "set.", "s": 5.538, "e": 6.084}], B = [0.0, 6.384], VEND = 6.084, DUR = 6.684, NB = B.length - 1;
const KEYS = new Set(["fooled", "comments", "subscribe"]);
const INK = "#1c1c1c", RED = "#d62828", OR = "#e07a00", GRN = "#2a9d5c", DOT = "#4a4a4a";
const clamp = v => Math.max(0, Math.min(1, v));
const ease = v => { v = clamp(v); return v * v * (3 - 2 * v); };
const bit = (i, k) => (i >> k) & 1;
const cvs = document.getElementById("cv"), x = cvs.getContext("2d");
const stat = document.getElementById("stat"), cap = document.getElementById("cap");
const FONT = "'JetBrains Mono', monospace";
function txt(s, px, py, size, col, align, weight) {
  x.font = (weight || "bold") + " " + Math.round(size * 1.12) + "px " + FONT; x.fillStyle = col || INK;
  x.textAlign = align || "center"; x.textBaseline = "middle"; x.fillText(s, px, py);
}
function circ(cx, cy, r, fill, stroke, lw, alpha) {
  x.globalAlpha = alpha == null ? 1 : alpha; x.beginPath(); x.arc(cx, cy, r, 0, 6.283);
  if (fill) { x.fillStyle = fill; x.fill(); } if (stroke) { x.strokeStyle = stroke; x.lineWidth = lw || 4; x.stroke(); }
  x.globalAlpha = 1;
}
function rect(px, py, w, h, fill, stroke, lw, alpha) {
  x.globalAlpha = alpha == null ? 1 : alpha;
  if (fill) { x.fillStyle = fill; x.fillRect(px, py, w, h); }
  if (stroke) { x.strokeStyle = stroke; x.lineWidth = lw || 4; x.strokeRect(px, py, w, h); }
  x.globalAlpha = 1;
}
function line(x1, y1, x2, y2, col, lw, alpha) {
  x.globalAlpha = alpha == null ? 1 : alpha; x.strokeStyle = col || INK; x.lineWidth = lw || 3;
  x.beginPath(); x.moveTo(x1, y1); x.lineTo(x2, y2); x.stroke(); x.globalAlpha = 1;
}
function show(w) {
  const m = w.match(/^((?:one|zero)(?:-(?:one|zero))+)([.,?!]*)$/i);
  if (m) return m[1].toLowerCase().split("-").map(p => p === "one" ? 1 : 0).join("") + m[2];
  return w;
}
const groups = []; {
  let g = [];
  const flush = () => { if (g.length) { groups.push(g); g = []; } };
  WORDS.forEach((w, i) => {
    const t = show(w.w);
    if (g.length && (g.length >= 4 || g.map(o => show(o.w)).join(" ").length + t.length > 24)) flush();
    g.push({ ...w, i, txt: t });
    if (/[.?!]$/.test(w.w) || /,$/.test(w.w)) flush();
  });
  flush();
}
groups.forEach((g, gi) => {
  const el = document.createElement("div"); el.className = "g"; el.id = "g" + gi;
  g.forEach(w => {
    const s = document.createElement("span");
    s.className = "w" + (KEYS.has(w.txt.toLowerCase().replace(/[.,?!]/g, "")) ? " k" : "");
    s.textContent = w.txt + " "; w.el = s; el.appendChild(s);
  });
  cap.appendChild(el); g.el = el;
  g.start = g[0].s - 0.05; g.end = DUR;
});
groups.forEach((g, gi) => { if (gi + 1 < groups.length) g.end = Math.min(g[g.length - 1].e + 0.25, groups[gi + 1][0].s - 0.05); });
function blockOf(t) { let b = 0; for (let i = 0; i < NB; i++) if (t >= B[i]) b = i; return b; }

const NAMES = ["bottles", "doors", "birthday", "circle", "disks", "coins"];
function scene(t, b, u) {
  NAMES.forEach((c, i) => {
    const cx = 220 + (i % 3) * 320, cy = 520 + Math.floor(i / 3) * 190;
    rect(cx - 140, cy - 70, 280, 140, "#e8dcbc", INK, 4);
    txt(String(i + 1), cx - 100, cy - 32, 30, RED, "center"); txt(c, cx + 8, cy + 14, 30, INK, "center");
  });
  if (u > 0.5) txt("Show Your Work", 540, 960, 54, INK);
  return "WHICH ONE FOOLED YOU?";
}


function renderAt(t) {
  x.fillStyle = "#f4ecd8"; x.fillRect(0, 0, 1920, 1080);
  x.strokeStyle = "rgba(60,90,140,0.16)"; x.lineWidth = 2;
  for (let g = 0; g <= 1920; g += 40) { x.beginPath(); x.moveTo(g, 0); x.lineTo(g, 1080); x.stroke(); }
  for (let g = 0; g <= 1080; g += 40) { x.beginPath(); x.moveTo(0, g); x.lineTo(1920, g); x.stroke(); }
  const b = blockOf(t), u = clamp((t - B[b]) / (B[b + 1] - B[b]));
  if (t < LEAD) {
    stat.textContent = ""; x.textAlign = "center"; x.textBaseline = "middle";
    x.fillStyle = RED; x.font = "bold 44px " + FONT; x.fillText(CHAPTER.split("|")[0], 960, 430);
    x.fillStyle = INK; x.font = "bold 84px " + FONT; x.fillText(CHAPTER.split("|")[1], 960, 540);
    groups.forEach(g => { g.el.style.opacity = 0; });
    return;
  }
  x.save(); x.translate(463, -126); x.scale(0.92, 0.92);
  stat.textContent = scene(t, b, u) || "";
  x.restore();
  groups.forEach(g => {
    const on = t >= g.start && t < g.end;
    g.el.style.opacity = on ? 1 : 0;
    if (on) g.forEach(w => w.el.classList.toggle("on", t >= w.s));
  });
}
window.addEventListener("hf-seek", e => renderAt(e.detail.time));
renderAt(0);
const tl = gsap.timeline({ paused: true });
tl.fromTo("#title", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0);
window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
</script>
</body>
</html>
