<!doctype html><html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&display=swap');
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#f4ecd8;font-family:'JetBrains Mono',monospace;color:#1c1c1c}
.t{position:absolute;left:90px;font-weight:800;line-height:1;letter-spacing:-2px}
.chip{position:absolute;left:90px;top:80px;background:#d62828;color:#f4ecd8;font-weight:800;font-size:64px;padding:14px 34px;letter-spacing:2px}
svg{position:absolute;left:0;top:0}
</style></head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<div class="chip">6 PUZZLES</div>
<div class="t" style="top:260px;font-size:200px">YOUR GUT</div>
<div class="t" style="top:480px;font-size:200px;color:#d62828">IS WRONG</div>
<div class="t" style="top:800px;font-size:70px;font-weight:700;letter-spacing:0">with the proof, one by one</div>
<script>
const s=document.getElementById('s'),N='http://www.w3.org/2000/svg';
const add=(t,a)=>{const e=document.createElementNS(N,t);for(const k in a)e.setAttribute(k,a[k]);s.appendChild(e)};
for(let g=0;g<=1920;g+=60)add('line',{x1:g,y1:0,x2:g,y2:1080,stroke:'rgba(60,90,140,0.16)','stroke-width':3});
for(let g=0;g<=1080;g+=60)add('line',{x1:0,y1:g,x2:1920,y2:g,stroke:'rgba(60,90,140,0.16)','stroke-width':3});
const n=7,sp=108,ox=1630-(n-1)*sp/2,oy=540-(n-1)*sp/2;
for(let r=0;r<n;r++)for(let c=0;c<n;c++){ if(r===2&&c===4)continue; add('circle',{cx:ox+c*sp,cy:oy+r*sp,r:26,fill:'#4a4a4a','fill-opacity':.75}); }
const cx=ox+4*sp,cy=oy+2*sp;
add('circle',{cx,cy,r:44,fill:'#d62828'}); add('circle',{cx,cy,r:80,fill:'none',stroke:'#d62828','stroke-width':14});
</script></body></html>
