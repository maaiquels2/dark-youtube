<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #f4ecd8; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #f4ecd8;
    font-family: "JetBrains Mono", monospace; color: #1c1c1c; }
  #cv { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .t { position: absolute; left: 0; width: 1080px; text-align: center; font-weight: 700; }
  #title { top: 292px; font-size: 46px; white-space: nowrap; }
  #stat { top: 356px; font-size: 28px; opacity: .7; letter-spacing: 2px; }
  #cap { top: 1124px; left: 120px; width: 840px; font-size: 50px; line-height: 60px; height: 120px; }
  .g { position: absolute; left: 0; top: 0; width: 840px; text-align: center; opacity: 0; }
  .w { opacity: .22; }
  .w.on { opacity: 1; }
  .w.k.on { color: #d62828; }
  #end { position: absolute; inset: 0; background: #f4ecd8; opacity: 0; }
  #end .a { position: absolute; left: 0; width: 1080px; text-align: center; font-weight: 700; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="10.723" data-width="1080" data-height="1920">
  <canvas id="cv" class="clip" data-start="0" data-duration="10.723" width="1080" height="1920"></canvas>
  <div id="title" class="clip t" data-start="0" data-duration="10.723">Which one <span style="color:#d62828">fooled</span> you?</div>
  <div id="stat" class="clip t" data-start="0" data-duration="10.723"></div>
  <div id="cap" class="clip t" data-start="0" data-duration="10.723"></div>
  <div id="end" class="clip" data-start="0" data-duration="10.723">
    <div class="a" style="top:700px;font-size:96px;">Show Your Work</div>
    <div class="a" style="top:850px;font-size:40px;opacity:.7;">one puzzle at a time</div>
    <div class="a" style="top:1000px;font-size:44px;color:#d62828;">Follow for the next one</div>
  </div>
  <audio id="voice" src="assets/voice.mp3" data-start="0" data-duration="10.723" data-volume="1"></audio>
</div>
<script>
const WORDS = [{"w": "That's", "s": 0.0, "e": 0.279}, {"w": "six", "s": 0.325, "e": 0.534}, {"w": "puzzles.", "s": 0.604, "e": 1.161}, {"w": "Which", "s": 1.463, "e": 1.672}, {"w": "one", "s": 1.73, "e": 1.881}, {"w": "fooled", "s": 1.95, "e": 2.264}, {"w": "you", "s": 2.299, "e": 2.38}, {"w": "the", "s": 2.438, "e": 2.508}, {"w": "most?", "s": 2.566, "e": 2.961}, {"w": "Tell", "s": 3.367, "e": 3.564}, {"w": "us", "s": 3.622, "e": 3.692}, {"w": "in", "s": 3.738, "e": 3.796}, {"w": "the", "s": 3.82, "e": 3.889}, {"w": "comments,", "s": 3.936, "e": 4.365}, {"w": "and", "s": 4.389, "e": 4.47}, {"w": "subscribe", "s": 4.516, "e": 4.981}, {"w": "if", "s": 5.004, "e": 5.062}, {"w": "you", "s": 5.097, "e": 5.166}, {"w": "want", "s": 5.213, "e": 5.352}, {"w": "the", "s": 5.387, "e": 5.457}, {"w": "next", "s": 5.492, "e": 5.654}, {"w": "set.", "s": 5.689, "e": 6.223}], B = [0.0, 6.523], VEND = 6.223, DUR = 10.723, NB = B.length - 1;
const KEYS = new Set(["fooled", "comments", "subscribe"]);
const INK = "#1c1c1c", RED = "#d62828", OR = "#e07a00", GRN = "#2a9d5c", DOT = "#4a4a4a";
const clamp = v => Math.max(0, Math.min(1, v));
const ease = v => { v = clamp(v); return v * v * (3 - 2 * v); };
const bit = (i, k) => (i >> k) & 1;
const cvs = document.getElementById("cv"), x = cvs.getContext("2d");
const stat = document.getElementById("stat"), cap = document.getElementById("cap");
const FONT = "'JetBrains Mono', monospace";
function txt(s, px, py, size, col, align, weight) {
  x.font = (weight || "bold") + " " + Math.round(size * 1.12) + "px " + FONT; x.fillStyle = col || INK;
  x.textAlign = align || "center"; x.textBaseline = "middle"; x.fillText(s, px, py);
}
function circ(cx, cy, r, fill, stroke, lw, alpha) {
  x.globalAlpha = alpha == null ? 1 : alpha; x.beginPath(); x.arc(cx, cy, r, 0, 6.283);
  if (fill) { x.fillStyle = fill; x.fill(); } if (stroke) { x.strokeStyle = stroke; x.lineWidth = lw || 4; x.stroke(); }
  x.globalAlpha = 1;
}
function rect(px, py, w, h, fill, stroke, lw, alpha) {
  x.globalAlpha = alpha == null ? 1 : alpha;
  if (fill) { x.fillStyle = fill; x.fillRect(px, py, w, h); }
  if (stroke) { x.strokeStyle = stroke; x.lineWidth = lw || 4; x.strokeRect(px, py, w, h); }
  x.globalAlpha = 1;
}
function line(x1, y1, x2, y2, col, lw, alpha) {
  x.globalAlpha = alpha == null ? 1 : alpha; x.strokeStyle = col || INK; x.lineWidth = lw || 3;
  x.beginPath(); x.moveTo(x1, y1); x.lineTo(x2, y2); x.stroke(); x.globalAlpha = 1;
}
function show(w) {
  const m = w.match(/^((?:one|zero)(?:-(?:one|zero))+)([.,?!]*)$/i);
  if (m) return m[1].toLowerCase().split("-").map(p => p === "one" ? 1 : 0).join("") + m[2];
  return w;
}
const groups = []; {
  let g = [];
  const flush = () => { if (g.length) { groups.push(g); g = []; } };
  WORDS.forEach((w, i) => {
    const t = show(w.w);
    if (g.length && (g.length >= 4 || g.map(o => show(o.w)).join(" ").length + t.length > 24)) flush();
    g.push({ ...w, i, txt: t });
    if (/[.?!]$/.test(w.w) || /,$/.test(w.w)) flush();
  });
  flush();
}
groups.forEach((g, gi) => {
  const el = document.createElement("div"); el.className = "g"; el.id = "g" + gi;
  g.forEach(w => {
    const s = document.createElement("span");
    s.className = "w" + (KEYS.has(w.txt.toLowerCase().replace(/[.,?!]/g, "")) ? " k" : "");
    s.textContent = w.txt + " "; w.el = s; el.appendChild(s);
  });
  cap.appendChild(el); g.el = el;
  g.start = g[0].s - 0.05; g.end = DUR;
});
groups.forEach((g, gi) => { if (gi + 1 < groups.length) g.end = Math.min(g[g.length - 1].e + 0.25, groups[gi + 1][0].s - 0.05); });
function blockOf(t) { let b = 0; for (let i = 0; i < NB; i++) if (t >= B[i]) b = i; return b; }

const NAMES = ["bottles", "doors", "birthday", "circle", "disks", "coins"];
function scene(t, b, u) {
  NAMES.forEach((c, i) => {
    const cx = 220 + (i % 3) * 320, cy = 520 + Math.floor(i / 3) * 190;
    rect(cx - 140, cy - 70, 280, 140, "#e8dcbc", INK, 4);
    txt(String(i + 1), cx - 100, cy - 32, 30, RED, "center"); txt(c, cx + 8, cy + 14, 30, INK, "center");
  });
  if (u > 0.5) txt("Show Your Work", 540, 960, 54, INK);
  return "WHICH ONE FOOLED YOU?";
}


function renderAt(t) {
  x.fillStyle = "#f4ecd8"; x.fillRect(0, 0, 1080, 1920);
  x.strokeStyle = "rgba(60,90,140,0.16)"; x.lineWidth = 2;
  for (let g = 0; g <= 1080; g += 40) { x.beginPath(); x.moveTo(g, 0); x.lineTo(g, 1920); x.stroke(); }
  for (let g = 0; g <= 1920; g += 40) { x.beginPath(); x.moveTo(0, g); x.lineTo(1080, g); x.stroke(); }
  const b = blockOf(t), u = clamp((t - B[b]) / (B[b + 1] - B[b]));
  x.save(); x.translate(130, 216.7); x.scale(0.78, 0.78);
  stat.textContent = scene(t, b, u) || "";
  x.restore();
  groups.forEach(g => {
    const on = t >= g.start && t < g.end;
    g.el.style.opacity = on ? 1 : 0;
    if (on) g.forEach(w => w.el.classList.toggle("on", t >= w.s));
  });
}
window.addEventListener("hf-seek", e => renderAt(e.detail.time));
renderAt(0);
const tl = gsap.timeline({ paused: true });
tl.fromTo("#end", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, VEND + 0.6);
window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
</script>
</body>
</html>
