<!doctype html><html><body style="margin:0;background:#000"><canvas id="c" width="1080" height="1920"></canvas>
<script>
const x=document.getElementById("c").getContext("2d"),IM={};
for(const n of ["03_inflation","07_stars"]){const i=new Image();i.src="../img/"+n+".png";IM[n]=i}
const clamp=v=>Math.max(0,Math.min(1,v)),ease=v=>{v=clamp(v);return v*v*(3-2*v)},hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
function vig(){const v=x.createRadialGradient(540,960,500,540,960,1250);v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(0,0,0,.65)");x.fillStyle=v;x.fillRect(0,0,1080,1920)}
function cam(img,z,rot,dx,dy,alpha,add){x.save();if(add)x.globalCompositeOperation="lighter";x.globalAlpha=alpha;x.translate(540+dx,960+dy);x.rotate(rot);x.scale(z,z);x.drawImage(img,-540,-960,1080,1920);x.restore()}
function inflation(t){const im=IM["03_inflation"],p=ease(t/6),CX=540,CY=770;
 x.fillStyle="#000";x.fillRect(0,0,1080,1920);
 const sh=Math.max(0,1-t/1.4),dx=Math.sin(t*66)*18*sh,dy=Math.cos(t*57)*12*sh;
 // desfoque radial por acumulo de escalas
 for(let k=0;k<9;k++){const z=1.0+.4*p+k*.03*(.4+p),a=k===0?1:.22;cam(im,z,p*.05,dx,dy,k===0?1:a,k>0)}
 x.save();x.globalCompositeOperation="lighter";
 for(let i=0;i<120;i++){const a=hash(i)*6.283,sp=.5+hash(i+4),ph=(hash(i+7)+t*.5*sp)%1,r=ph*ph*1300+30,len=40+ph*220;
  x.strokeStyle="rgba("+(150+hash(i+2)*100|0)+",200,255,"+(.8*(1-ph*.6))+")";x.lineWidth=1.5+3*ph;x.beginPath();x.moveTo(CX+Math.cos(a)*(r-len),CY+Math.sin(a)*(r-len));x.lineTo(CX+Math.cos(a)*r,CY+Math.sin(a)*r);x.stroke()}
 const g=x.createRadialGradient(CX,CY,0,CX,CY,170+50*Math.sin(t*7));g.addColorStop(0,"rgba(255,255,255,.5)");g.addColorStop(1,"rgba(120,170,255,0)");x.fillStyle=g;x.fillRect(0,0,1080,1920);x.restore();
 if(t<.6){const f=1-t/.6;x.fillStyle="rgba(255,255,255,"+f+")";x.fillRect(0,0,1080,1920);const c=x.canvas;x.save();x.globalCompositeOperation="screen";x.globalAlpha=.4*f;x.drawImage(c,30*f,0);x.drawImage(c,-30*f,0);x.restore()}
 vig()}
function stars(t){const im=IM["07_stars"],p=ease(t/6),CX=540,CY=780;
 x.fillStyle="#000";x.fillRect(0,0,1080,1920);
 cam(im,1.05+.22*p,Math.sin(t*.4)*.012,Math.sin(t*.5)*14,-30*p,1,false);
 cam(im,1.12+.30*p,Math.sin(t*.4)*.012,Math.sin(t*.5)*26,-55*p,.28+.12*Math.sin(t*3),true);
 x.save();x.globalCompositeOperation="lighter";
 // raios girando saindo da estrela principal
 for(let i=0;i<14;i++){const a=i*.4488+t*.08+Math.sin(t*.7+i)*.03,l=700+300*hash(i);const g=x.createLinearGradient(CX,CY,CX+Math.cos(a)*l,CY+Math.sin(a)*l);g.addColorStop(0,"rgba(190,225,255,.22)");g.addColorStop(1,"rgba(190,225,255,0)");x.strokeStyle=g;x.lineWidth=3+8*hash(i+3);x.beginPath();x.moveTo(CX,CY);x.lineTo(CX+Math.cos(a)*l,CY+Math.sin(a)*l);x.stroke()}
 // estrelas cintilando com cruz
 for(let i=0;i<46;i++){const px=hash(i)*1080,py=hash(i+50)*1700+80,tw=Math.max(0,Math.sin(t*(1.5+hash(i+9)*3)+i*5)),r=6+22*tw*hash(i+2);if(tw<.15)continue;
  x.fillStyle="rgba(210,230,255,"+(.25+.6*tw)+")";x.beginPath();x.arc(px,py,1.5+2*tw,0,6.283);x.fill();x.strokeStyle="rgba(220,235,255,"+(.5*tw)+")";x.lineWidth=1.5;x.beginPath();x.moveTo(px-r,py);x.lineTo(px+r,py);x.moveTo(px,py-r);x.lineTo(px,py+r);x.stroke()}
 // poeira em 3 camadas de paralaxe
 for(let L=0;L<3;L++)for(let i=0;i<50;i++){const sp=12+L*34,px=((hash(i+L*90)*1200-t*sp)%1200+1200)%1200-60,py=((hash(i+L*90+400)*2000-t*sp*.4)%2000+2000)%2000-40;x.fillStyle="rgba(200,220,255,"+(.15+L*.1)+")";x.beginPath();x.arc(px,py,1+L*1.3,0,6.283);x.fill()}
 const g=x.createRadialGradient(CX,CY,0,CX,CY,200+30*Math.sin(t*2.2));g.addColorStop(0,"rgba(255,255,255,.55)");g.addColorStop(1,"rgba(150,200,255,0)");x.fillStyle=g;x.fillRect(0,0,1080,1920);x.restore();
 vig()}
</script></body></html>
