<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1080px;height:1080px;background:#f4ecd8;overflow:hidden}
  svg{display:block}
</style></head>
<body>
<svg id="s" width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const s=document.getElementById('s'),N='http://www.w3.org/2000/svg';
const add=(t,a)=>{const e=document.createElementNS(N,t);for(const k in a)e.setAttribute(k,a[k]);s.appendChild(e)};
for(let g=0;g<=1080;g+=60){add('line',{x1:g,y1:0,x2:g,y2:1080,stroke:'rgba(60,90,140,0.16)','stroke-width':3});add('line',{x1:0,y1:g,x2:1080,y2:g,stroke:'rgba(60,90,140,0.16)','stroke-width':3})}
const n=7,sp=96,o=540-(n-1)*sp/2;
for(let r=0;r<n;r++)for(let c=0;c<n;c++){
  if(r===2&&c===4)continue;
  add('circle',{cx:o+c*sp,cy:o+r*sp,r:22,fill:'#4a4a4a','fill-opacity':.7});
}
const cx=o+4*sp,cy=o+2*sp;
add('circle',{cx,cy,r:36,fill:'#d62828'});
add('circle',{cx,cy,r:66,fill:'none',stroke:'#d62828','stroke-width':12});
</script></body></html>
