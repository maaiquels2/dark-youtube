<body>
<svg id="s" width="2560" height="1440" viewBox="0 0 2560 1440" xmlns="http://www.w3.org/2000/svg"></svg>
<div class="t" style="top:556px;font-size:150px;font-weight:700;line-height:1">Show Your Work</div>
<div class="t" style="top:742px;font-size:56px;font-weight:500;opacity:.7;line-height:1">one puzzle at a time</div>
<script>
const s=document.getElementById('s'),N='http://www.w3.org/2000/svg';
const add=(t,a)=>{const e=document.createElementNS(N,t);for(const k in a)e.setAttribute(k,a[k]);s.appendChild(e)};
for(let g=0;g<=2560;g+=80)add('line',{x1:g,y1:0,x2:g,y2:1440,stroke:'rgba(60,90,140,0.16)','stroke-width':3});
for(let g=0;g<=1440;g+=80)add('line',{x1:0,y1:g,x2:2560,y2:g,stroke:'rgba(60,90,140,0.16)','stroke-width':3});
// dot fields outside the 1546x423 safe area (x 507..2053, y 508..931)
const P=[[2,1],[3,2]];
for(let r=0;r<12;r++)for(let c=0;c<64;c++){
  const x=40+c*40,y=60+r*110; if(r<0)continue;
}
for(let r=0;r<16;r++)for(let c=0;c<64;c++){
  const x=20+c*40,y=20+r*88;
  if(x>470&&x<2090&&y>470&&y<970)continue;
  if(c%2||r%1)continue;
  add('circle',{cx:x,cy:y,r:8,fill:'#4a4a4a','fill-opacity':.55});
}
add('circle',{cx:2260,cy:380,r:20,fill:'#d62828'});
add('circle',{cx:2260,cy:380,r:50,fill:'none',stroke:'#d62828','stroke-width':8});
</script></body></html>
