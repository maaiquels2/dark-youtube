    line10(st); const d = deduce(p);
    txt("prisoner " + (p + 1) + " sees " + d.seen + " red", 540, 900, 44, INK);
    txt("code + answers heard → mine is " + (d.red ? "red" : "blue"), 540, 980, 38, d.red ? RED : BLU);
    return "EACH ONE UPDATES THE COUNT";
  }
  const st = { 0: "back" }; for (let i = 1; i < 10; i++) st[i] = "ok";
  line10(st); txt("99 saved for sure", 540, 900, 70, GRN); txt("the first: 50 / 50", 540, 1000, 44, OR);
  return "ONE BIT, PASSED DOWN THE LINE";
}


function renderAt(t) {
  x.fillStyle = "#f4ecd8"; x.fillRect(0, 0, 1080, 1920);
  x.strokeStyle = "rgba(60,90,140,0.16)"; x.lineWidth = 2;
  for (let g = 0; g <= 1080; g += 40) { x.beginPath(); x.moveTo(g, 0); x.lineTo(g, 1920); x.stroke(); }
  for (let g = 0; g <= 1920; g += 40) { x.beginPath(); x.moveTo(0, g); x.lineTo(1080, g); x.stroke(); }
  const b = blockOf(t), u = clamp((t - B[b]) / (B[b + 1] - B[b]));
  x.save(); x.translate(130, 216.7); x.scale(0.78, 0.78);
  stat.textContent = scene(t, b, u) || "";
  x.restore();
  groups.forEach(g => {
    const on = t >= g.start && t < g.end;
    g.el.style.opacity = on ? 1 : 0;
    if (on) g.forEach(w => w.el.classList.toggle("on", t >= w.s));
  });
}
